<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#66bb6a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="每日" />
  <title>每日 · 个人工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-logo">每</span>
        <span class="brand-name">每日</span>
      </div>
      <nav id="nav">
        <button class="nav-item" data-route="habits"><span class="nav-ico">🌱</span><span class="nav-label">习惯养成</span></button>
        <button class="nav-item" data-route="research"><span class="nav-ico">🔬</span><span class="nav-label">科研</span></button>
        <button class="nav-item" data-route="exercise"><span class="nav-ico">🚴</span><span class="nav-label">运动</span></button>
        <button class="nav-item" data-route="study"><span class="nav-ico">📚</span><span class="nav-label">学习</span></button>
        <button class="nav-item" data-route="news"><span class="nav-ico">📰</span><span class="nav-label">新闻热点</span></button>
        <button class="nav-item" data-route="plans"><span class="nav-ico">🗂️</span><span class="nav-label">我的计划</span></button>
        <button class="nav-item" data-route="mood"><span class="nav-ico">💗</span><span class="nav-label">心情日记</span></button>
        <button class="nav-item" data-route="review"><span class="nav-ico">🌳</span><span class="nav-label">每月复盘</span></button>
      </nav>
      <div class="side-foot">
        <button id="installBtn" class="install-btn" hidden>＋ 安装到桌面</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="top-title">
          <span id="pageTitle">习惯养成</span>
          <span id="pageDate" class="page-date"></span>
        </div>
        <div id="topExtra" class="top-extra"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
